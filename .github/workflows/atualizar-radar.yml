
name: Atualizar Radar de Concursos

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testar filtros de vagas antes da coleta
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Executar coleta de noticias
        run: python scripts/atualizar_radar_v2_4.py

      - name: Validar editais e gerar fila
        run: python scripts/validar_editais.py
      - name: Buscar oportunidades de emprego
        run: python scripts/radar_empregos.py

      - name: Buscar oportunidades regionais e consultoria
        run: python scripts/radar_oportunidades.py

      - name: Salvar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add concursos.json candidatos.json fila_verificacao.json vagas.json oportunidades.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualizacao automatica do Radar 2.6"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
