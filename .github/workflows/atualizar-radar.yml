
name: Atualizar Radar de Concursos

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar atualizacao
        run: python scripts/atualizar_radar.py

      - name: Salvar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concursos.json candidatos.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizacao automatica do Radar"
            git push
          fi
