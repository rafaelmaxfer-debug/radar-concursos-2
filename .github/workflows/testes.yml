name: Testes do Radar
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar scripts
        run: python -m compileall -q scripts
      - name: Validar filtros sem rede
        run: python -m unittest discover -s tests -p 'test_*.py'
